<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Search System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Movie Search System</h2>

    <!-- Search Section  -->
    <div class="box">
        <h3>Search Movies by ID</h3>
        <input type="number" id="searchId" placeholder="Enter ID (e.g. 107)">
        <button onclick="runSearch()">Search</button>
        <p id="searchResult" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <!-- Unsorted List Section  -->
    <div class="box">
        <h3>Unsorted</h3>
        <ul id="unsortedList"></ul>
    </div>

    <!-- Sorted List Section -->
    <div class="box">
        <h3>Sorted (Ascending ID)</h3>
        <ul id="sortedList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
